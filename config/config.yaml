project:
  random_state: 42
paths:
  shops: Shopee_Dataset/1_Structured_Data/shops_master.xlsx
  products: Shopee_Dataset/2_Semi_Structured_Data
  reviews: Shopee_Dataset/3_Unstructured_Data
  processed: Shopee_Dataset/4_Processed_Data
  output: output
clustering:
  n_clusters: 3
  features: [Comment_Length, rating, Sentiment_Score, has_image]
  authenticity_mapping: {}
classification:
  test_size: 0.2
  n_estimators: 100
  accuracy_target: 0.75
  labels:
    0: Kem
    1: Binh_thuong
    2: Uy_tin
regression:
  target: Follower_Count_k
reputation:
  authentic_review_weight: 0.50
  chat_response_weight: 0.30
  follower_weight: 0.20
